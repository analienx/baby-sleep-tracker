name: Little Rest iPhone PWA — build and browser tests

on:
  push:
    branches: [feat/ios-home-screen-pwa]
  pull_request:
    paths:
      - 'lib/**'
      - 'web/**'
      - 'scripts/generate_pwa_worker.py'
      - 'firebase.pwa.json'
      - '.github/workflows/ios-pwa-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: little-rest-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve pinned packages
        run: flutter pub get --enforce-lockfile
      - name: Format and analyze
        run: |
          dart format --output=none --set-exit-if-changed lib
          flutter analyze --no-pub
      - name: Flutter unit tests
        run: flutter test --no-pub
      - name: Compile registered Spark QA PWA (NOT automatically deployed)
        run: |
          python3 -c "from pathlib import Path; import json; p=Path('web/firebase-staging.defines.json'); c=json.loads(p.read_text(encoding='utf-8-sig')); assert c['FIREBASE_PROJECT_ID']=='little-rest-stage-jh-261020'; assert c['FIREBASE_WEB_APP_ID']=='1:256303473837:web:a78e23179e13f4ed6d9224'; assert all(c[x]=='true' for x in ('USE_IOS_PWA','USE_PERSONAL_STAGING','USE_SPARK_FAMILY_LITE')); p.write_text(json.dumps(c),encoding='utf-8')"
          flutter build web --release --no-pub --pwa-strategy=none \
            --dart-define-from-file=web/firebase-staging.defines.json
          python3 scripts/generate_pwa_worker.py build/web
      - name: Verify metadata and offline worker
        run: |
          python3 -c "from pathlib import Path; import json; r=Path('build/web'); m=json.loads((r/'manifest.json').read_text()); assert m['display']=='standalone'; assert m['start_url']=='/'; assert (r/'pwa-sw.js').exists(); assert (r/'main.dart.js').exists(); assert 'little-rest-shell-' in (r/'pwa-sw.js').read_text()"
          node --check build/web/pwa-sw.js
      - name: Retain actual Spark staging PWA for manual reviewed deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: little-rest-ios-pwa-staging-${{ github.sha }}
          path: build/web
          retention-days: 5
