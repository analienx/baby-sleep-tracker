name: Persistent family E2E

on:
  pull_request:
    paths:
      - '.github/workflows/family-e2e.yml'
      - 'integration_test/**'
      - 'lib/**'
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:
    inputs:
      device_host:
        description: 'Private IPv4 of Firebase test server for the downloadable debug APK; leave at 10.0.2.2 for Android emulator'
        required: false
        default: '10.0.2.2'
        type: string

permissions:
  contents: read

concurrency:
  group: family-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-family-e2e:
    name: Android UI + real Firebase emulators
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      DEVICE_HOST: ${{ inputs.device_host || '10.0.2.2' }}
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Restore Flutter packages
        run: flutter pub get

      - name: Keep resolved dependency lock for integration_test pinning
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persistent-e2e-resolved-lock-${{ github.sha }}
          path: pubspec.lock
          retention-days: 7

      - name: Check test source formatting and analyzer
        run: |
          dart format --output=none --set-exit-if-changed integration_test
          flutter analyze --no-pub

      - name: Install Node and Firebase emulators
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install emulator dependencies
        run: |
          java -version
          npm ci --prefix functions --no-audit --no-fund

      - name: Validate private debug build server IP
        run: |
          python3 - <<'PY'
          import ipaddress, os
          addr = ipaddress.ip_address(os.environ["DEVICE_HOST"])
          allowed = (
              ipaddress.ip_network("10.0.0.0/8"),
              ipaddress.ip_network("172.16.0.0/12"),
              ipaddress.ip_network("192.168.0.0/16"),
              ipaddress.ip_network("127.0.0.0/8"),
          )
          assert addr.version == 4 and any(addr in net for net in allowed), (
              "Use a trusted private IPv4 host, never public Firebase endpoints"
          )
          print("Validated private-only debug target")
          PY

      - name: Build genuinely persistent family-enabled APK (synthetic test backend)
        run: |
          flutter build apk --debug --no-pub \
            --dart-define=USE_FAMILY_EMULATOR=true \
            --dart-define=FIREBASE_EMULATOR_HOST="$DEVICE_HOST"

      - name: Retain installable persistent test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: little-rest-family-persistent-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run real Flutter UI against real Auth, Firestore and Functions emulators
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p .e2e
            npm exec --prefix functions -- firebase emulators:exec \
              --project demo-little-rest \
              --config firebase.json \
              --only auth,firestore,functions \
              "bash scripts/family-e2e-android.sh" \
              2>&1 | tee .e2e/flutter-integration.log

      - name: Upload E2E evidence including failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: family-e2e-evidence-${{ github.sha }}
          path: .e2e/
          if-no-files-found: warn
          retention-days: 7
