name: Spark staging Android

on:
  push:
    branches:
      - feat/spark-personal-cloud-light-ui
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/spark-staging-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-staging-apk:
    if: github.repository == 'analienx/baby-sleep-tracker' && vars.LITTLE_REST_STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LITTLE_REST_STAGING_BUILD: '1'
      LITTLE_REST_STAGING_KEYSTORE_PATH: /tmp/little-rest-staging.p12
      LITTLE_REST_STAGING_KEYSTORE_PASSWORD: ${{ secrets.LITTLE_REST_STAGING_P12_PASSWORD }}
      STAGE_P12_B64: ${{ secrets.LITTLE_REST_STAGING_P12_B64 }}
      STAGE_CONFIG_B64: ${{ secrets.LITTLE_REST_STAGING_CONFIG_B64 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare staging SDK config and repeatable debug signing
        run: |
          test -n "$STAGE_P12_B64"
          test -n "$STAGE_CONFIG_B64"
          test -n "$LITTLE_REST_STAGING_KEYSTORE_PASSWORD"
          printf '%s' "$STAGE_P12_B64" | base64 -d > "$LITTLE_REST_STAGING_KEYSTORE_PATH"
          printf '%s' "$STAGE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/personal-staging.json"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"])/"personal-staging.json"
          cfg = json.loads(p.read_text(encoding="utf-8"))
          required = ["FIREBASE_PROJECT_ID", "FIREBASE_ANDROID_APP_ID",
                      "FIREBASE_ANDROID_API_KEY", "FIREBASE_IOS_API_KEY",
                      "FIREBASE_MESSAGING_SENDER_ID", "FIREBASE_IOS_APP_ID",
                      "FIREBASE_IOS_BUNDLE_ID"]
          assert all(cfg.get(k) for k in required), "Incomplete staging SDK config"
          assert cfg["FIREBASE_PROJECT_ID"] == "little-rest-stage-jh-261020"
          assert cfg["FIREBASE_ANDROID_APP_ID"] == "1:256303473837:android:87f5a15b2bc10e226d9224"
          print("Staging app ID verified; key values withheld")
          PY
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Build private Firebase Spark test app
        run: |
          flutter build apk --debug --no-pub \
            --dart-define=USE_PERSONAL_STAGING=true \
            --dart-define-from-file="$RUNNER_TEMP/personal-staging.json"
      - name: Verify staged package differs from preview
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -path '*/aapt' -type f | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-debug.apk \
            | grep "package: name='com.analienx.baby_sleep_tracker.staging'"
      - name: Upload signed test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: little-rest-spark-staging-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
