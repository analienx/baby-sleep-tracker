name: Spark Family Lite Android E2E

on:
  push:
    branches: [feat/spark-family-lite]
  pull_request:
    paths:
      - 'firestore.rules'
      - 'lib/**'
      - 'integration_test/spark_family_lite_emulator_test.dart'
      - 'scripts/spark-family-lite-e2e-android.sh'
      - '.github/workflows/spark-family-lite-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-lite-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-authenticated-caregivers:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Validate Dart and integration tests
        run: |
          if ! dart format --output=none --set-exit-if-changed lib integration_test/spark_family_lite_emulator_test.dart; then
            dart format lib integration_test/spark_family_lite_emulator_test.dart
            git diff -- lib integration_test/spark_family_lite_emulator_test.dart
            exit 1
          fi
          flutter analyze --no-pub
      - name: Node 22 / Firebase emulators
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Java 21 ONLY on ephemeral runner
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Firebase emulators and rule-test dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Two independent Firebase Auth accounts, share, revoke, fence
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p e2e-evidence
            bash -o pipefail -c 'npm exec --prefix functions -- firebase emulators:exec --project demo-little-rest --config firebase.json --only auth,firestore "bash scripts/spark-family-lite-e2e-android.sh" 2>&1 | tee e2e-evidence/spark-lite-run.log'
      - name: Retain synthetic evidence for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spark-family-lite-e2e-${{ github.sha }}
          path: e2e-evidence/
          if-no-files-found: warn
          retention-days: 7
