name: Flutter CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test, Android debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Restore locked packages
        run: flutter pub get

      - name: Verify dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Capture resolved lockfile for reproducibility
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolved-pubspec-lock-${{ github.sha }}
          path: pubspec.lock
          retention-days: 7

      - name: Test staging deployment script
        run: python3 -m unittest discover -s scripts -p test_staging_deploy.py -v

      - name: Enforce Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart and Flutter
        run: flutter analyze --no-pub

      - name: Run deterministic unit, widget and golden tests
        run: flutter test --no-pub

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Retain debug build for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baby-sleep-tracker-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history for leak detection
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 / Node 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  ios-smoke:
    name: iOS simulator build (unsigned)
    # Keep macOS minutes limited to reviewable PRs and manual verification.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Restore locked packages
        run: flutter pub get

      - name: Verify dependency lockfile is reproducible
        run: git diff --exit-code -- pubspec.lock

      - name: Compile iOS simulator app without signing
        # Firebase Apple SDK 13 needs Swift 6.2; macos-15 defaults to Xcode
        # 16.4 even though the image also provides 26.2. Pin this explicitly.
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          xcodebuild -version
          flutter build ios --simulator --no-codesign --no-pub

      - name: Boot iPhone simulator and launch the application
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); ids=[d["udid"] for ds in data["devices"].values() for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")]; print(ids[0] if ids else "")')"
          test -n "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIMULATOR_UDID" com.analienx.babySleepTracker
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ios-smoke.png

      - name: Retain iPhone simulator screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baby-sleep-tracker-ios-smoke-${{ github.sha }}
          path: build/ios-smoke.png
          if-no-files-found: error
          retention-days: 7

  android-smoke:
    name: Android emulator launch
    needs: quality
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Download exact checked APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: baby-sleep-tracker-debug-${{ github.sha }}
          path: .smoke

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android emulator, install and launch application
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install .smoke/app-debug.apk
            adb shell am start -W -n com.analienx.baby_sleep_tracker/.MainActivity
            sleep 5
            adb shell pidof com.analienx.baby_sleep_tracker
            adb exec-out screencap -p > .smoke/android-smoke.png

      - name: Retain Android emulator screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baby-sleep-tracker-android-smoke-${{ github.sha }}
          path: .smoke/android-smoke.png
          if-no-files-found: error
          retention-days: 7
