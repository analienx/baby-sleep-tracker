name: Spark theme visual references

on:
  push:
    branches: [feat/spark-personal-cloud-light-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-goldens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-goldens:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Format source on a runner without local Java
        run: dart format lib test integration_test
      - name: Analyze formatted source
        run: flutter analyze --no-pub
      - name: Render golden references
        run: flutter test --no-pub --update-goldens test/widget_test.dart
      - name: Capture runner formatting changes
        if: always()
        run: git diff --binary -- '*.dart' > "$RUNNER_TEMP/flutter-format.patch"
      - name: Upload formatting patch
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spark-dart-format-${{ github.sha }}
          path: ${{ runner.temp }}/flutter-format.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Upload golden images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spark-theme-goldens-${{ github.sha }}
          path: test/goldens/*.png
          if-no-files-found: warn
          retention-days: 7
