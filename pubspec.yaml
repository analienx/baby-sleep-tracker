name: baby_sleep_tracker
description: A calm, family-first sleep tracker for Android and iPhone.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.0
  uuid: ^4.5.2
  timezone: ^0.11.2
  firebase_core: ^5.0.0
  firebase_app_check: ^0.5.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.3
  share_plus: ^13.3.1
  cloud_functions: ^7.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
